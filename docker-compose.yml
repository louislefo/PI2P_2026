services:

  # ─── Pont caméra CSI (nappe OV5647) ────────────────────────────────
  # Capture la caméra via rpicam-vid et expose un flux MJPEG HTTP
  # sur http://192.168.137.94:8081/stream
  camera-bridge-csi:
    build: 
      context: ./camera-bridge
      dockerfile: Dockerfile
    privileged: true              # Accès complet aux devices libcamera/ISP
    volumes:
      - /run/udev:/run/udev:ro    # Requis par libcamera pour la détection des devices
    ports:
      - "8081:8081"               # Optionnel : pour déboguer depuis le PC
    restart: always

  # ─── Pont caméra USB (WCAM100BK) ──────────────────────────────────
  # Capture la caméra USB via OpenCV et expose sur http://192.168.137.94:8082/stream
  camera-bridge-usb:
    build: 
      context: ./camera-bridge
      dockerfile: Dockerfile.usb
    privileged: true
    devices:
      - "/dev/video1:/dev/video0"
    ports:
      - "8082:8082"
    restart: always

  # ─── Hardware Bridge (LEDs + Servo + Audio) ────────────────────────
  # Contrôle GPIO via API REST sur http://192.168.137.94:8083
  hardware-bridge:
    build:
      context: ./hardware-bridge
      dockerfile: Dockerfile
    privileged: true                  # Requis pour GPIO + /dev/snd
    devices:
      - "/dev/snd:/dev/snd"           # Sortie audio jack 3.5mm
    environment:
      - PIN_LED_GREEN=27              # Board pin 13
      - PIN_LED_ORANGE=17             # Board pin 11
      - PIN_LED_RED=22                # Board pin 15
      - PIN_SERVO=12                  # Board pin 32 / PWM0
    ports:
      - "8083:8083"
    restart: always

  # ─── Dashboard React ────────────────────────────────────────────────
  dashboard:
    build: ./frontend
    ports:
      - "80:80"
    restart: always
